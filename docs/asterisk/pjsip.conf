; modec bench PBX -- endpoints.  Asterisk 20/22, chan_pjsip.
;
; Three legs meet here: the HT802's two FXS ports (1001, 1002) and
; baresip in front of modec (2001).  Everything is PCMU, because a
; native ulaw bridge is the only path that does not resample.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------------
; The template every bench leg uses.  Each line here is load-bearing;
; the defaults are tuned for speech and every one of them is wrong for
; a modem.
; ---------------------------------------------------------------------
[bench](!)
type=endpoint
context=bench
disallow=all
allow=ulaw                 ; ulaw ONLY.  A leg that cannot do it should
                           ; fail the call, not quietly get transcoded.
direct_media=no            ; keep Asterisk in the media path so
                           ; MixMonitor can see it (see asterisk.md)
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=inband           ; tones stay in the audio; nothing regenerates
                           ; them.  Modec.Dtmf is the detector here.
fax_detect=no              ; never switch modes mid-call on a 2100 Hz tone
t38_udptl=no
allow_transfer=no          ; no in-call feature digits, so no DTMF
                           ; detector is ever attached to the bridge
rtp_timeout=0              ; a trained modem is continuous audio anyway
tos_audio=ef
cos_audio=5

[bench-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

; ---------------------------------------------------------------------
; 1001 -- HT802 FXS port 1, the USR
; ---------------------------------------------------------------------
[1001](bench)
aors=1001
auth=1001
callerid=USR <1001>

[1001]
type=auth
auth_type=userpass
username=1001
password=CHANGEME-1001

[1001](bench-aor)

; ---------------------------------------------------------------------
; 1002 -- HT802 FXS port 2.  A butt set or a second modem; leaving a
; plain analogue phone here is worth it just to hear a handshake.
; ---------------------------------------------------------------------
[1002](bench)
aors=1002
auth=1002
callerid=Port2 <1002>

[1002]
type=auth
auth_type=userpass
username=1002
password=CHANGEME-1002

[1002](bench-aor)

; ---------------------------------------------------------------------
; 2001 -- baresip, with modec behind it.  answermode=manual in
; docs/baresip/accounts means ATA still decides when to pick up.
; ---------------------------------------------------------------------
[2001](bench)
aors=2001
auth=2001
callerid=modec <2001>

[2001]
type=auth
auth_type=userpass
username=2001
password=CHANGEME-2001

[2001](bench-aor)

; ---------------------------------------------------------------------
; Optional: the voip.ms trunk from docs/voipms.md, so a real BBS number
; can be dialled from the USR's keypad through the same recording path.
; Uncomment and fill in once the local legs work.
; ---------------------------------------------------------------------
;[voipms]
;type=registration
;transport=transport-udp
;outbound_auth=voipms
;server_uri=sip:seattle.voip.ms
;client_uri=sip:CHANGEME@seattle.voip.ms
;retry_interval=60
;
;[voipms]
;type=auth
;auth_type=userpass
;username=CHANGEME
;password=CHANGEME
;
;[voipms]
;type=aor
;contact=sip:seattle.voip.ms
;
;[voipms](bench)
;context=from-trunk
;aors=voipms
;outbound_auth=voipms
;from_user=CHANGEME
;from_domain=seattle.voip.ms
;
;[voipms]
;type=identify
;endpoint=voipms
;match=seattle.voip.ms
