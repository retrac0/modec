; modec bench PBX -- dialplan.
;
; Two jobs.  One: put the USR, the spare FXS port and modec in reach of
; each other with real call progress, so Modec.Progress and Modec.Hayes
; see ringback, busy and reorder rather than a socket that either opens
; or does not.  Two: record every call as two separate legs, which is
; how recordings/ grows without anyone dialling a BBS.

[globals]
; Must be writable by the user Asterisk runs as.  Simplest fix on Arch:
;   sudo usermod -aG joel asterisk && chmod g+w ~/modec/recordings
; or point this at /var/spool/asterisk/monitor and symlink afterwards.
BENCHREC=/home/joel/modec/recordings

; ---------------------------------------------------------------------
; Everything enters here, gets a recording tap, and is then routed.
; ---------------------------------------------------------------------
[bench]
exten => _X.,1,NoOp(bench: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(TAG=${STRFTIME(${EPOCH},,%Y%m%dT%H%M%S)}-${CALLERID(num)}-${EXTEN})
 ; t() is what THIS channel transmitted, so it is the originator's
 ; signal; r() is what it received, the answerer's.  The undecorated
 ; file is the sum -- useless as a corpus, but it is what a butt set
 ; across the pair would hear, which is the signal an echo-cancelling
 ; receiver actually faces.
 same => n,MixMonitor(${BENCHREC}/${TAG}.wav,r(${BENCHREC}/${TAG}-ans.wav)t(${BENCHREC}/${TAG}-orig.wav))
 same => n,Goto(bench-route,${EXTEN},1)

[bench-route]
; --- the three legs -------------------------------------------------
exten => 1001,1,Dial(PJSIP/1001,60)      ; the USR
exten => 1002,1,Dial(PJSIP/1002,60)      ; spare FXS port
exten => 2001,1,Dial(PJSIP/2001,60)      ; baresip -> modec

; --- measurement ----------------------------------------------------
; 600: 1004 Hz at 0 dBm0.  This is the level reference for the whole
; path.  Dial it from modec, measure what arrives, and the difference
; is the ATA's gain plus the codec -- set the HT802's RX/TX gain from
; that number rather than by ear.  Feeds Modec.Metrics.
exten => 600,1,Answer()
 same => n,Milliwatt()

; 601: round-trip.  Gives the end-to-end delay and, with the USR
; off-hook on the other port, shows the ATA's hybrid echo path --
; the thing Modec.Echo is guessing at.
exten => 601,1,Answer()
 same => n,Echo()

; 602: your own sweep.  Generate it with modec, drop it at
; /var/lib/asterisk/sounds/en/bench/sweep.wav (8 kHz, 16-bit mono),
; and the recording is the path's frequency response.
exten => 602,1,Answer()
 same => n,Playback(bench/sweep)
 same => n,Hangup()

; 603: silence for 30 s.  The noise floor of the ATA and the codec,
; in the same units Modec.Channel states its own in.
exten => 603,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; --- call progress, for Modec.Progress ------------------------------
; 604: a bare 2100 Hz V.25 answer tone with no modem behind it, so
; detection can be tested without a handshake following.  Playtones
; cannot do the phase reversals or the 15 Hz AM of ANSam; for real
; ANSam, synthesise one with modec and Playback it instead.
exten => 604,1,Answer()
 same => n,Playtones(2100)
 same => n,Wait(5)
 same => n,StopPlaytones()
 same => n,Hangup()

exten => 605,1,Busy(30)                  ; busy tone
exten => 606,1,Congestion(30)            ; reorder / fast busy
exten => 607,1,Ringing()                 ; rings and is never answered
 same => n,Wait(60)
 same => n,Hangup()

; --- deliberate impairment ------------------------------------------
; Asterisk adds no jitter buffer unless asked, which is why none of the
; above mention one.  Dial 6NN through here to ask for one on purpose:
; the PBX becomes another controllable impairment, in the spirit of
; Modec.Channel, rather than an uncontrolled one.
exten => _69X,1,NoOp(jitter buffer ${EXTEN:2}0 ms toward 2001)
 same => n,Set(JITTERBUFFER(fixed)=${EXTEN:2}0)
 same => n,Dial(PJSIP/2001,60)

; --- outbound over the trunk, if one is configured -------------------
;exten => _1NXXNXXXXXX,1,Dial(PJSIP/${EXTEN}@voipms,90)
;exten => _NXXNXXXXXX,1,Dial(PJSIP/1${EXTEN}@voipms,90)

;[from-trunk]
;exten => _X.,1,Goto(bench,2001,1)       ; inbound DID -> modec
