; Make the wrong thing impossible rather than merely switched off.
[modules]
autoload=yes

; No compressed codec may be offered, even by accident.
noload => codec_opus.so
noload => codec_g722.so
noload => codec_gsm.so
noload => codec_speex.so
noload => codec_ilbc.so
noload => codec_g726.so
noload => codec_adpcm.so
noload => codec_lpc10.so

; codec_ulaw.so must STAY loaded: MixMonitor's audiohook decodes to
; slin to write the wav.  That costs nothing -- ulaw -> linear -> ulaw
; is a bijection over the 256 codepoints, as Modec.G711's own tables
; will confirm -- but without it there is no recording.

; T.38 cannot be renegotiated if it was never loaded.
noload => res_pjsip_t38.so

; chan_sip is gone in 21+; harmless if absent.
noload => chan_sip.so
